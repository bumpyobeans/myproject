<style>
  :root {
    --bg: #fbf3e2;
    --card: #fffaf0;
    --ink: #2b1d14;
    --muted: #7a6656;
    --orange: #f2601e;
    --green: #3f8f3a;
    --wood: #e9c58f;
    --line: #ead9bd;
    --pink: #fde3e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { font-size: 14px; letter-spacing: .08em; color: var(--muted); }
  h1 { margin: 4px 0 6px; font-size: 32px; line-height: 1.2; }
  h1 em { font-style: normal; color: var(--orange); }
  .sub { margin: 0 0 20px; color: var(--muted); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; }
  .panel {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    background: var(--pink); color: #b2354a;
    border-radius: 999px; padding: 4px 10px; font-size: 13px;
  }
  a.btn, button.btn {
    display: inline-block; border: 0; cursor: pointer;
    background: var(--orange); color: #fff; text-decoration: none;
    font: inherit; font-size: 17px;
    border-radius: 14px; padding: 12px 18px;
  }
  a.btn.ghost { background: transparent; color: var(--orange); border: 2px solid var(--orange); }
  button.btn[disabled] { opacity: .5; cursor: default; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

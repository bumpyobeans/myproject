<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 인증 — 김현정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #241811;
      --bg-mid: #3a2418;
      --crema: #c98a4b;
      --cream: #f3e3d0;
      --text: #f6ecdf;
      --text-dim: #c9ac91;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #5b3a24 0%, transparent 60%),
        radial-gradient(900px 500px at 80% 120%, #2a1a12 0%, transparent 55%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* 흩어진 원두 */
    .bean {
      position: fixed;
      width: 34px;
      height: 22px;
      background: radial-gradient(circle at 35% 35%, #6b4326, #3c2415);
      border-radius: 50% / 60%;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
      opacity: 0.55;
    }
    .bean::after {
      content: "";
      position: absolute;
      inset: 0;
      border-left: 2px solid rgba(0,0,0,0.45);
      border-radius: inherit;
      transform: rotate(8deg);
    }
    .bean.b1 { top: 12%;  left: 14%; transform: rotate(-25deg); }
    .bean.b2 { top: 74%;  left: 10%; transform: rotate(35deg);  width: 40px; height: 26px; }
    .bean.b3 { top: 22%;  right: 12%; transform: rotate(18deg); }
    .bean.b4 { top: 66%;  right: 16%; transform: rotate(-40deg); width: 28px; height: 18px; }
    .bean.b5 { top: 45%;  left: 6%;  transform: rotate(60deg); opacity: 0.3; }
    .bean.b6 { top: 8%;   right: 34%; transform: rotate(-12deg); opacity: 0.35; }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 52px 40px 44px;
      text-align: center;
      background: rgba(28, 18, 12, 0.55);
      border: 1px solid rgba(201, 138, 75, 0.35);
      border-radius: 26px;
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      animation: rise 0.8s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 커피잔 */
    .cup-wrap {
      position: relative;
      width: 140px;
      height: 130px;
      margin: 0 auto 26px;
    }
    .steam {
      position: absolute;
      left: 50%;
      bottom: 92px;
      width: 10px;
      height: 46px;
      background: linear-gradient(to top, rgba(243,227,208,0.6), transparent);
      border-radius: 10px;
      filter: blur(3px);
      transform-origin: bottom center;
    }
    .steam.s1 { margin-left: -22px; animation: steam 3.4s ease-in-out infinite; }
    .steam.s2 { margin-left: -3px;  animation: steam 3.4s ease-in-out infinite 0.7s; height: 54px; }
    .steam.s3 { margin-left: 14px;  animation: steam 3.4s ease-in-out infinite 1.4s; }
    @keyframes steam {
      0%   { opacity: 0; transform: translateY(6px) scaleY(0.6) rotate(0deg); }
      35%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-30px) scaleY(1.15) rotate(6deg); }
    }
    .cup {
      position: absolute;
      bottom: 0;
      left: 12px;
      width: 104px;
      height: 84px;
      background: linear-gradient(180deg, #f6ecdf 0%, #e4cdb2 100%);
      border-radius: 10px 10px 46px 46px / 10px 10px 40px 40px;
      box-shadow: inset 0 -10px 18px rgba(0,0,0,0.12);
    }
    .cup::before { /* 커피 표면 */
      content: "";
      position: absolute;
      top: 9px; left: 10px; right: 10px;
      height: 16px;
      background: radial-gradient(circle at 50% 40%, #7a4a29, #43271557);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(201,138,75,0.35);
    }
    .handle {
      position: absolute;
      right: -2px;
      bottom: 26px;
      width: 34px;
      height: 40px;
      border: 9px solid #e4cdb2;
      border-radius: 0 40px 40px 0;
    }
    .saucer {
      position: absolute;
      bottom: -8px;
      left: -6px;
      width: 140px;
      height: 16px;
      background: linear-gradient(180deg, #efe0cd, #cdb195);
      border-radius: 50%;
    }

    h1 {
      font-size: 27px;
      line-height: 1.55;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .name { color: var(--crema); }
    .divider {
      width: 46px;
      height: 3px;
      margin: 18px auto 16px;
      background: var(--crema);
      border-radius: 3px;
      opacity: 0.8;
    }
    p.sub {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.7;
    }
    .foot {
      margin-top: 30px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #9c7c62;
      text-transform: uppercase;
    }
    .roastery {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #7d6250;
    }

    @media (max-width: 420px) {
      .card { padding: 42px 24px 36px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <span class="bean b1"></span>
  <span class="bean b2"></span>
  <span class="bean b3"></span>
  <span class="bean b4"></span>
  <span class="bean b5"></span>
  <span class="bean b6"></span>

  <main class="card">
    <div class="cup-wrap">
      <span class="steam s1"></span>
      <span class="steam s2"></span>
      <span class="steam s3"></span>
      <div class="cup">
        <span class="handle"></span>
        <span class="saucer"></span>
      </div>
    </div>

    <h1>안녕하세요, <span class="name">김현정</span>입니다.<br />Ai 내일바꿈 1기 시작!</h1>
    <div class="divider"></div>
    <p class="sub">20년 스페셜티 커피처럼,<br />하루 한 잔씩 정성껏 내려가겠습니다.</p>

    <div class="foot">
      2026 · 첫 웹페이지 인증
      <span class="roastery">BEOMPYO ROASTERY</span>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>범표원두 커피 추천 상담</title>

  <!-- 카카오톡/문자 등으로 링크 공유할 때 뜨는 미리보기 카드 (오픈그래프) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="범표원두">
  <meta property="og:title" content="범표원두 커피 추천 상담">
  <meta property="og:description" content="몇 가지 질문에 답하면 나에게 맞는 범표원두 커피를 찾아드려요.">
  <meta property="og:image" content="https://beompyo-wondu-chucheon.vercel.app/og-image.jpg">
  <meta property="og:url" content="https://beompyo-wondu-chucheon.vercel.app">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="범표원두 커피 추천 상담">
  <meta name="twitter:description" content="몇 가지 질문에 답하면 나에게 맞는 범표원두 커피를 찾아드려요.">
  <meta name="twitter:image" content="https://beompyo-wondu-chucheon.vercel.app/og-image.jpg">

  <!-- ============================================================
       스타일 (외부 폰트/라이브러리 불러오지 않음. 전부 시스템 폰트)
       범표원두 로스터리 톤:
         배경   짙은 브라운 #2c1e14
         글자   크림색     #f3e3d0
         포인트 크레마 브라운 #c98a4b
       ============================================================ -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
      background: #22160e;
      color: #f3e3d0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 가운데 좁은 칼럼: 모바일 375px ~ 데스크톱 최대 480px */
    .wrap {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #2c1e14;
      display: flex;
      flex-direction: column;
    }

    /* ---------- 공통 헤더 ---------- */
    .top-bar {
      padding: 14px 18px;
      border-bottom: 1px solid #43301f;
      font-size: 15px;
      font-weight: 700;
      color: #c98a4b;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* ---------- 첫 화면 ---------- */
    #screen-intro {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 26px;
    }
    .intro-emoji { font-size: 46px; margin-bottom: 22px; }
    .intro-main {
      font-size: 21px;
      font-weight: 700;
      color: #f3e3d0;
      margin-bottom: 18px;
      word-break: keep-all;
    }
    .intro-main span { display: block; }
    .intro-sub {
      font-size: 14px;
      color: #cdb69c;
      margin-bottom: 34px;
      word-break: keep-all;
    }

    /* ---------- 버튼 공통 ---------- */
    .primary-btn {
      background: #c98a4b;
      color: #2c1e14;
      border: none;
      border-radius: 26px;
      padding: 14px 34px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .primary-btn:active { background: #b7793c; }

    /* ---------- 상담(채팅) 화면 ---------- */
    #screen-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;   /* 스크롤이 제대로 되도록 */
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 8px;
    }

    .row { display: flex; margin-bottom: 12px; }
    .row-sys { justify-content: flex-start; }
    .row-user { justify-content: flex-end; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      word-break: keep-all;
      white-space: pre-wrap;
    }
    .bubble-sys {
      background: #3d2c1c;
      color: #f3e3d0;
      border-top-left-radius: 4px;
    }
    .bubble-user {
      background: #c98a4b;
      color: #2c1e14;
      font-weight: 600;
      border-top-right-radius: 4px;
    }

    /* "입력 중..." 점 세 개 애니메이션 */
    .typing { display: flex; gap: 5px; align-items: center; }
    .typing .dot {
      width: 7px; height: 7px;
      background: #c98a4b;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite ease-in-out;
    }
    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    /* ---------- 선택지 버튼 영역 ---------- */
    #choice-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #43301f;
      flex-shrink: 0;
    }
    .choice {
      background: #2c1e14;
      color: #f3e3d0;
      border: 1px solid #c98a4b;
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .choice:active { background: #3d2c1c; }

    /* ---------- 추천 결과 카드 ---------- */
    .result-card {
      background: #3d2c1c;
      border: 1px solid #5a4028;
      border-radius: 16px;
      padding: 18px;
      width: 100%;
    }
    .result-label {
      font-size: 15px;
      font-weight: 800;
      color: #c98a4b;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .result-head {
      margin-bottom: 12px;
    }
    .result-sub {
      font-size: 12px;
      color: #d9c2a5;
      opacity: 0.85;
      line-height: 1.5;
    }
    .prod-img {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 4px;
      border-radius: 12px;
      object-fit: contain;
      background: #efe1cd;
      display: block;
    }
    .prod-img-empty {
      background: #55483b;
      color: #d8c6b2;
      font-size: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prod-name {
      font-size: 18px;
      font-weight: 700;
      color: #f3e3d0;
      margin-top: 12px;
    }
    .prod-line {
      font-size: 12px;
      color: #cdb69c;
      margin-top: 4px;
      word-break: keep-all;
    }
    .prod-price {
      font-size: 16px;
      font-weight: 700;
      color: #c98a4b;
      margin-top: 6px;
    }
    .why-label {
      font-size: 11px;
      font-weight: 700;
      color: #c98a4b;
      letter-spacing: 0.5px;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .prod-why {
      font-size: 14px;
      color: #f3e3d0;
      word-break: keep-all;
      line-height: 1.55;
      background: rgba(201, 138, 75, 0.12);
      border-left: 3px solid #c98a4b;
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
    }
    .prod-hint {
      font-size: 12px;
      color: #cdb69c;
      margin-top: 6px;
      word-break: keep-all;
    }
    .flavor-picker { margin-top: 10px; }
    .flavor-picker-label {
      font-size: 12px;
      color: #cdb69c;
      margin-bottom: 6px;
    }
    .flavor-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .flavor-chip {
      background: transparent;
      color: #f3e3d0;
      border: 1px solid #c98a4b;
      border-radius: 16px;
      padding: 7px 13px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .flavor-chip.active {
      background: #c98a4b;
      color: #2c1e14;
      font-weight: 700;
    }

    /* ---------- 실제 구매자 후기 카드 ---------- */
    .review-card {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #5a4028;
    }
    .review-label {
      margin-bottom: 8px;
    }
    .review-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .review-photo-thumb {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .review-photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .review-content {
      flex: 1;
      min-width: 0;
    }
    .review-stars {
      color: #c98a4b;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .review-text {
      font-size: 13px;
      color: #e7d6c1;
      white-space: pre-wrap;
      word-break: keep-all;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .review-meta {
      font-size: 11px;
      color: #a08b76;
      margin-top: 6px;
    }
    .shop-btn {
      display: block;
      text-align: center;
      margin-top: 14px;
      background: #c98a4b;
      color: #2c1e14;
      border: none;
      border-radius: 22px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .shop-btn-disabled {
      background: #55483b;
      color: #a08b76;
      cursor: not-allowed;
    }
    .result-divider {
      height: 1px;
      background: #5a4028;
      margin: 20px 0 16px;
    }

    /* ---------- 샘플(처음이라 부담되시면) 카드: 더 작게, 크레마 브라운 테두리 ---------- */
    .sample-label, .sample-label .result-label {
      color: #c98a4b;
    }
    .sample-card {
      border: 1px solid #c98a4b;
      border-radius: 12px;
      padding: 12px;
    }
    .sample-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .prod-img-small {
      width: 64px;
      height: 64px;
      max-width: none;
      aspect-ratio: auto;
      margin: 0;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .sample-info {
      flex: 1;
      min-width: 0;
    }
    .sample-name {
      font-size: 14px;
      margin-top: 0;
    }
    .sample-info .shop-btn {
      margin-top: 8px;
      padding: 8px 0;
      font-size: 13px;
    }

    /* ---------- 하단 다시하기 ---------- */
    #restart-btn {
      margin: 12px 14px 18px;
      background: transparent;
      color: #c98a4b;
      border: 1px solid #c98a4b;
      border-radius: 22px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- 친구에게 링크 보내기 ---------- */
    .share-card {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(201, 138, 75, 0.12);
      border: 1px dashed #c98a4b;
    }
    .share-text {
      font-size: 13px;
      color: #d9c2a5;
      line-height: 1.55;
      margin-top: 4px;
    }
    .share-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      background: transparent;
      color: #c98a4b;
      border: 1px solid #c98a4b;
      border-radius: 22px;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .share-btn:active { background: rgba(201, 138, 75, 0.2); }
    .share-done {
      margin-top: 8px;
      font-size: 12px;
      color: #c98a4b;
      text-align: center;
      min-height: 16px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">범표원두 · 커피 추천 상담</div>

    <!-- ================= 첫 화면 ================= -->
    <section id="screen-intro">
      <div class="intro-emoji">☕</div>
      <div class="intro-main">
        <span>맛있는 커피 만드는 건 전문가에게 맡겨.</span>
        <span>너희는 맛있게 즐기기만 해.</span>
      </div>
      <div class="intro-sub">재미있게 대화하면서 내 커피를 발견해보세요.</div>
      <button id="start-btn" class="primary-btn" type="button">상담 시작하기</button>
    </section>

    <!-- ================= 상담(채팅) 화면 ================= -->
    <section id="screen-chat" hidden>
      <div id="chat-log"></div>
      <div id="choice-box"></div>
      <button id="restart-btn" type="button" hidden>🔁 다시 확인하기</button>
    </section>
  </div>

  <!-- 일반 script 태그 + 전역 변수만 사용 (ES 모듈 없음) -->
  <script src="products.js"></script>
  <script src="reviews.js"></script>
  <script src="app.js"></script>
</body>
</html>
